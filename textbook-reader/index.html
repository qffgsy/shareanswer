<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
  <title>大气污染控制工程 · 课本阅读</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header><div class="top"><a href="../#papers">ShareAnswer · 课程大屏</a><span>课本阅读</span></div></header>
  <main>
    <div class="intro"><div><p class="eyebrow">COURSE READING · 大气污染控制工程</p><h1>大气污染控制工程 <small>第 3 版</small></h1><p>使用专属阅读链接打开；每次按需显示一页。</p></div></div>
    <section class="reader" aria-label="课本阅读器">
      <div id="entry" class="entry" hidden><h2>输入专属阅读链接</h2><p>请粘贴收到的完整阅读链接，或直接使用该链接打开本页。</p><label for="share-link">专属阅读链接</label><div class="entry-controls"><input id="share-link" type="text" placeholder="粘贴完整链接" autocomplete="off"><button id="open-link" type="button">打开课本</button></div></div>
      <p id="status" role="status" aria-live="polite">正在准备阅读器…</p>
      <div id="controls" class="controls" hidden>
        <div class="control-group"><button id="prev" type="button">上一页</button><label for="page">第</label><input id="page" type="number" min="1" inputmode="numeric"><span id="page-total">页</span><button id="next" type="button">下一页</button></div>
        <div class="control-group"><button id="zoom-out" type="button" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="zoom-in" type="button" aria-label="放大">＋</button><button id="fit" type="button">适合宽度</button></div>
      </div>
      <div id="canvas-wrap" class="canvas-wrap" hidden><canvas id="page-canvas" aria-label="课本页面"></canvas></div>
    </section>
    <p class="note">请妥善保管阅读链接；持有完整链接的人可以转发或保存阅读内容。</p>
  </main>
  <script type="module" src="reader.js"></script>
</body>
</html>
